<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 미니게임</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="card">
  <h1 id="title">🎮 미니게임</h1>
  <div class="sub" id="subtitle">여러 명이 동시에 · 실시간 WebSocket</div>
  <button class="btn-guide" id="guideOpen">❔ 게임 설명 보기</button>

  <!-- 재접속 중 -->
  <div id="reconnecting" class="hidden">
    <div class="invite-info">🔄 <b>다시 연결하는 중…</b><br><span style="font-size:13px;color:#94a3b8">이전 게임으로 돌아갑니다</span></div>
    <button class="btn-link" id="giveUpReconnect">← 그만두고 처음부터</button>
  </div>

  <!-- 로그인 -->
  <div id="login">
    <label>닉네임</label>
    <input id="name" placeholder="닉네임" maxlength="16" />

    <!-- 모드 선택 -->
    <div id="modeButtons" class="mode-row">
      <button class="btn-create" id="showCreate">＋ 방 만들기</button>
      <button class="btn-join" id="showJoin">→ 입장하기</button>
    </div>

    <!-- 지금 열린 공개 방 — 첫 화면엔 게임별 개수만, 목록은 모달에서 -->
    <div id="lobby">
      <div class="lobbyhead">
        <span id="lobbyCount">지금 열린 방</span>
        <button id="lobbyRefresh">↻ 새로고침</button>
      </div>
      <div id="lobbySummary"></div>
    </div>

    <!-- 방 만들기 패널 -->
    <div id="createPanel" class="hidden">
      <label>어떤 게임을 할까요</label>
      <div class="gamepick" id="gamePick"></div>
      <label>방 이름 <span style="color:#64748b">(비우면 lobby)</span></label>
      <input id="createRoom" placeholder="새 방 이름" maxlength="16" />
      <label class="checkrow">
        <input type="checkbox" id="createPrivate" />
        <span>비공개 방으로 만들기 <span style="color:#64748b">— 첫 화면 목록에 뜨지 않고 초대 링크로만 들어옵니다</span></span>
      </label>
      <div class="subfield hidden" id="privatePassRow">
        <label>비밀번호 <span style="color:#64748b">(선택 · 비우면 없음)</span></label>
        <input id="createPass" type="password" placeholder="비밀번호" maxlength="20" autocomplete="off" />
      </div>
      <label id="roundsLabel">몇 판 <span style="color:#64748b">(1~20)</span></label>
      <input id="createRounds" type="number" min="1" max="20" value="3" />
      <button class="btn-guide hidden" id="editorOpenCreate" style="margin:0 0 12px; width:100%"></button>
      <button class="btn-primary" id="createBtn">방 만들고 입장</button>
      <button class="btn-link" id="backFromCreate">← 뒤로</button>
    </div>

    <!-- 입장하기 패널 -->
    <div id="joinPanel" class="hidden">
      <label>방 이름 <span style="color:#64748b">(들어갈 방 이름)</span></label>
      <input id="joinRoom" placeholder="방 이름" maxlength="16" />
      <button class="btn-primary" id="joinBtn">입장하기</button>
      <button class="btn-link" id="backFromJoin">← 뒤로</button>
    </div>

    <!-- 초대 링크로 접속한 경우 (닉네임만 입력) -->
    <div id="invitePanel" class="hidden">
      <div class="invite-info">🔗 <b id="inviteRoomName"></b> 방에 초대되었습니다</div>
      <button class="btn-primary" id="inviteJoinBtn">입장하기</button>
    </div>

    <!-- 잠긴 방 (비밀번호가 필요할 때만 나타난다) -->
    <div id="passPanel" class="hidden">
      <div class="invite-info">🔒 <b id="passRoomName"></b> 방은 비밀번호가 필요합니다</div>
      <input id="joinPass" type="password" placeholder="비밀번호" maxlength="20" autocomplete="off" />
      <button class="btn-primary" id="passBtn">입장하기</button>
      <button class="btn-link" id="passBack">← 뒤로</button>
    </div>

    <div id="loginError" class="error hidden"></div>
  </div>

  <!-- 게임 -->
  <div id="game" class="hidden">
    <div class="status" id="status">대기 중…</div>
    <div class="countdown hidden" id="countdown"></div>
    <div class="banner hidden" id="banner"></div>

    <!-- 게임별 UI가 여기 그려진다 (public/games/<id>.js) -->
    <div id="gamearea"></div>

    <button class="btn-primary" id="readyBtn">준비 완료</button>

    <!-- 매치 전 설정 (방장만) -->
    <div class="hidden" id="gameconfig"></div>
    <button class="btn-guide hidden" id="editorOpenRoom" style="width:100%"></button>
    <div class="deckbadge hidden" id="deckbadge"></div>

    <!-- 봇 (대기 중, 봇을 지원하는 게임에서만) -->
    <div class="botrow hidden" id="botrow">
      <span class="botlabel" id="botlabel">봇 0명</span>
      <button id="botMinus">－</button>
      <button id="botPlus">＋ 봇 추가</button>
    </div>

    <ul class="players" id="players"></ul>

    <!-- 이모지 리액션 -->
    <div class="reactrow" id="reactrow"></div>

    <!-- 지난 판 기록 -->
    <details class="history hidden" id="historyBox">
      <summary>📜 지난 판 기록</summary>
      <div class="histwrap" id="historyBody"></div>
    </details>

    <div class="roomtag" id="roomtag"></div>
    <button class="btn-invite" id="copyInviteBtn">🔗 초대 링크 복사</button>
    <button class="btn-link" id="leaveBtn">방 나가기</button>

    <div id="chatbox">
      <div id="chatlog"></div>
      <div class="chatrow">
        <input id="chatinput" placeholder="메시지…" maxlength="200" />
        <button id="chatsend">전송</button>
      </div>
    </div>
  </div>

  <!-- 최종 우승 오버레이 -->
  <div id="overlay" class="hidden">
    <div class="trophy">🏆</div>
    <div class="champ" id="champName"></div>
    <div class="final" id="champScore"></div>
    <button class="btn-primary" id="playAgainBtn">돌아가기</button>
    <button class="btn-share" id="shareBtn">📤 결과 이미지로 저장·공유</button>
    <button class="btn-link" id="overlayLeaveBtn" style="width:80%">방 나가기</button>
  </div>
</div>

<!-- 게임 설명 모달 -->
<div class="modal hidden" id="guideModal">
  <div class="modalcard">
    <div class="modalhead">
      <b>🎮 게임 설명</b>
      <button class="modalx" id="guideClose" aria-label="닫기">✕</button>
    </div>
    <div class="tabbar" id="guideTabs"></div>
    <div class="modalbody" id="guideBody"></div>
  </div>
</div>

<!-- 열린 방 목록 -->
<div class="modal hidden" id="roomsModal">
  <div class="modalcard">
    <div class="modalhead">
      <b>🚪 지금 열린 방</b>
      <button class="modalx" id="roomsClose" aria-label="닫기">✕</button>
    </div>
    <div class="tabbar" id="roomsTabs"></div>
    <div class="modalbody" id="roomsList"></div>
    <div class="modalfoot"><button class="btn-link" id="roomsRefresh">↻ 새로고침</button></div>
  </div>
</div>

<!-- 퀴즈 편집기 -->
<div class="modal hidden" id="editorModal">
  <div class="modalcard">
    <div class="modalhead">
      <b>📝 퀴즈 문제 만들기</b>
      <button class="modalx" id="editorClose" aria-label="닫기">✕</button>
    </div>
    <div class="modalbody" id="editorBody"></div>
    <div class="modalfoot" id="editorFoot"></div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
